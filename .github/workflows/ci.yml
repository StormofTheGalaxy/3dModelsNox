name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polyforge
          POSTGRES_PASSWORD: polyforge
          POSTGRES_DB: polyforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U polyforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://polyforge:polyforge@localhost:5432/polyforge_test?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
      AUTH_REFRESH_SECRET: ci-refresh-secret-value-that-is-long-enough
      AUTH_TOKEN_PEPPER: ci-token-pepper-value
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Схема применяется к чистой базе
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed
        env:
          SEED_ADMIN_EMAIL: ci@example.com
          SEED_ADMIN_PASSWORD: CiPassword123!

      - name: Типы
        run: npm run typecheck

      - name: Сборка
        run: npm run build
